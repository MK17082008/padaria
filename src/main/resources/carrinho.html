
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Padaria Doce Amor</title>
    <style>
        body {
            font-family: "Comic Sans MS", Arial;
            background: linear-gradient(180deg, #ffe5e5, #fff5f5, #ffeaea);
            margin: 0;
            padding: 20px;
        }
        h1 { text-align:center; color:#e60000; }
        #clienteNome { text-align:center; font-size:20px; color:#cc0000; margin-bottom:20px; }

        .carrinho-item {
            background:#ffffffdd;
            padding:15px;
            border-radius:12px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 0 10px rgba(255,0,0,0.2);
        }
        .item-info { flex:2; }
        .quantidade {
            display:flex;
            align-items:center;
            gap:5px;
        }
        .quantidade button {
            padding:5px 10px;
            border:none;
            background:#e60000;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }
        .quantidade button:hover { filter:brightness(1.2); }
        .quantidade input {
            width:50px;
            text-align:center;
            border-radius:5px;
            border:1px solid #ccc;
            padding:3px;
        }
        .remover-btn {
            padding:5px 10px;
            border:none;
            background:#990000;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }
        .remover-btn:hover { filter:brightness(1.2); }

        #total { text-align:right; font-size:18px; font-weight:bold; margin-top:20px; color:#cc0000; }
        #btnVoltar, #btnFinalizar {
            display:block;
            margin:20px auto;
            padding:10px 20px;
            background:linear-gradient(45deg,#e60000,#cc0000);
            color:white;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }
        #btnVoltar:hover, #btnFinalizar:hover { filter:brightness(1.15); }
    </style>
</head>
<body>

<h1>Seu Carrinho 🛒</h1>
<p id="clienteNome"></p>

<div id="carrinhoContainer"></div>
<p id="total"></p>

<button id="btnVoltar" onclick="voltarParaProdutos()">← Continuar Comprando</button>
<button id="btnFinalizar" onclick="finalizarPedido()">Finalizar Pedido</button>

<script>
    // Nome do cliente
    document.getElementById("clienteNome").innerText =
        "Olá, " + (localStorage.getItem("clienteNome") || "Cliente") + "!";

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    const container = document.getElementById("carrinhoContainer");
    const totalEl = document.getElementById("total");

    function atualizarCarrinho() {
        container.innerHTML = "";
        let total = 0;

        if(carrinho.length === 0){
            container.innerHTML = "<p>Seu carrinho está vazio.</p>";
            totalEl.innerText = "";
            return;
        }

        carrinho.forEach((item, index) => {
            total += item.preco * (item.quantidade || 1);

            const div = document.createElement("div");
            div.classList.add("carrinho-item");

            div.innerHTML = `
                <div class="item-info">${item.nome} - R$ ${item.preco.toFixed(2)}</div>
                <div class="quantidade">
                    <button onclick="alterarQuantidade(${index}, -1)">-</button>
                    <input type="number" min="1" value="${item.quantidade || 1}" onchange="alterarQuantidadeInput(${index}, this.value)">
                    <button onclick="alterarQuantidade(${index}, 1)">+</button>
                </div>
                <button class="remover-btn" onclick="removerItem(${index})">Remover</button>
            `;

            container.appendChild(div);
        });

        totalEl.innerText = "Total: R$ " + total.toFixed(2);
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
    }

    function alterarQuantidade(index, delta) {
        carrinho[index].quantidade = Math.max(1, (carrinho[index].quantidade || 1) + delta);
        atualizarCarrinho();
    }

    function alterarQuantidadeInput(index, quantidade) {
        quantidade = parseInt(quantidade);
        if(isNaN(quantidade) || quantidade < 1) quantidade = 1;
        carrinho[index].quantidade = quantidade;
        atualizarCarrinho();
    }

    function removerItem(index) {
        carrinho.splice(index, 1);
        atualizarCarrinho();
    }

    function voltarParaProdutos() {
        window.location.href = "padaria.html";
    }

    function finalizarPedido() {
        if(carrinho.length === 0){
            alert("Seu carrinho está vazio!");
            return;
        }
        window.location.href = "pagamento.html";
    }

    atualizarCarrinho();
</script>

</body>
</html>
