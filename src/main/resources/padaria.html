
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Doce Amor</title>
    <style>
        body {
            margin:0;
            padding:0;
            font-family:"Comic Sans MS", Arial;
            background: linear-gradient(180deg, #ffe5e5, #fff5f5, #ffeaea);
            overflow-x:hidden;
            cursor: url('https://i.imgur.com/sF1WolX.png'), auto;
        }

        /* LOGO COM BRILHO */
        .logo {
            text-align: center;
            font-size: 40px;
            margin-top: 40px;
            color: #e60000;
            text-shadow: 0 0 10px white, 0 0 20px #ff4d4d;
            animation: brilho 2s infinite alternate ease-in-out;
        }
        @keyframes brilho {
            from { text-shadow:0 0 5px #fff; }
            to { text-shadow:0 0 15px #ff6666; }
        }

        /* CALDA VERMELHA DESCENDO */
        .calda {
            position:absolute;
            top:0; left:0;
            width:100%;
            height:160px;
            background: linear-gradient(#e60000, #cc0000);
            border-bottom-left-radius:50%;
            border-bottom-right-radius:50%;
            z-index:1;
        }
        .calda::after {
            content:"";
            position:absolute;
            width:100%;
            height:40px;
            background:#cc0000;
            border-radius:50%;
            top:120px;
            filter:blur(10px);
            opacity:.6;
        }

        /* FUMAÇA */
        .fumaca {
            position:absolute;
            top:130px;
            left:50%;
            width:80px;
            height:80px;
            background: radial-gradient(circle,#ffffff80,transparent);
            border-radius:50%;
            animation: vapor 3s infinite;
            opacity:.5;
            z-index:0;
        }
        @keyframes vapor {
            0% { transform:translate(-50%,10px) scale(0.5); opacity:.7; }
            50% { transform:translate(-50%,-20px) scale(1); opacity:.3; }
            100% { transform:translate(-50%,-50px) scale(1.2); opacity:0; }
        }

        /* GOTAS */
        .gota { position:absolute; top:130px; width:35px; height:55px; background:#e60000; border-radius:50px; animation: pingar 2s infinite ease-in-out; z-index:1; }
        .g1 { left:20%; }
        .g2 { left:50%; animation-delay:0.4s; }
        .g3 { left:75%; animation-delay:0.8s; }
        @keyframes pingar { 0%{transform:translateY(0);opacity:1;}100%{transform:translateY(20px);opacity:0;} }

        /* GRANULADO */
        .granulado { position:absolute; top:-10px; width:8px; height:16px; border-radius:3px; animation:cair 4s linear infinite; opacity:.9; z-index:0; }
        @keyframes cair { from{transform:translateY(0) rotate(0);} to{transform:translateY(120vh) rotate(360deg);} }
        .gA{background:#e60000;} .gB{background:#ff4d4d;} .gC{background:#ff9999;} .gD{background:#ff6666;} .gE{background:#ff1a1a;}

        /* NOME DO CLIENTE */
        #clienteNome { text-align:center; font-size:22px; color:#cc0000; margin-top:10px; }

        /* PRODUTOS */
        .produtos {
            margin-top:200px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:25px;
            padding:20px;
        }
        .item {
            background:#ffffffdd;
            padding:15px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 15px rgba(255,0,0,0.2);
            position:relative;
            z-index:2;
            transition:0.3s;
        }
        .item:hover{ transform:scale(1.05); }
        .item img { width:150px; height:110px; border-radius:12px; box-shadow:0 0 10px #ff9999; }
        button {
            margin-top:10px;
            padding:10px;
            width:100%;
            border:none;
            background: linear-gradient(45deg,#e60000,#cc0000);
            color:white;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
            box-shadow:0 4px 0 #990000;
            transition:0.3s;
        }
        button:hover { transform:translateY(-3px); box-shadow:0 6px 0 #880000; filter:brightness(1.15); }

        /* BOTÃO CARRINHO */
        #btnCarrinho { display:block; margin:20px auto; padding:12px 30px; font-weight:bold; border:none; border-radius:10px; background:linear-gradient(45deg,#e60000,#cc0000); color:white; cursor:pointer; }
        #btnCarrinho:hover { filter:brightness(1.15); }
    </style>
</head>
<body>

<div class="calda"></div>
<div class="fumaca"></div>
<div class="gota g1"></div>
<div class="gota g2"></div>
<div class="gota g3"></div>

<script>
    for(let i=0;i<30;i++){
        let g=document.createElement("div");
        g.classList.add("granulado");
        let cores=["gA","gB","gC","gD","gE"];
        g.classList.add(cores[Math.floor(Math.random()*5)]);
        g.style.left=Math.random()*100+"%";
        g.style.animationDuration=(Math.random()*3+3)+"s";
        g.style.animationDelay=Math.random()*2+"s";
        document.body.appendChild(g);
    }
</script>

<div class="logo">Padaria Doce Amor 🍰</div>
<p id="clienteNome"></p>

<div class="produtos">
    <div class="item" id="p1">
        <h3>Pão Francês</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDVxKIBuZfjG2pj2Qx0QPjnPj9i9vKsw0fCg&s">
        <p>R$ 1.00</p>
        <button onclick="adicionar('Pão Francês',1.00,'p1',this)">Adicionar</button>
    </div>
    <div class="item" id="p2">
        <h3>Pão de Queijo</h3>
        <img src="https://moinhoglobo.com.br/wp-content/uploads/2016/03/44-p%C3%A3o-de-queijo.jpg">
        <p>R$ 1,50</p>
        <button onclick="adicionar('Pão de Queijo',1.50,'p2',this)">Adicionar</button>
    </div>
    <div class="item" id="p3">
        <h3>Bolo de Chocolate</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3zaXkuP720aNAu-sn7UU1p71XaTlGGMCf5A&s">
        <p>R$ 24,90</p>
        <button onclick="adicionar('Bolo de Chocolate',24.90,'p3',this)">Adicionar</button>
    </div>
    <div class="item" id="p4">
        <h3>Croissant</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiDtkdyRh2yjlRKvzCN-zboBk2zQt-AqGKzg&s">
        <p>R$ 6,00</p>
        <button onclick="adicionar('Croissant',6.00,'p4',this)">Adicionar</button>
    </div>
    <div class="item" id="p5">
        <h3>Rosquinha</h3>
        <img src="https://guiadacozinha.com.br/wp-content/uploads/2019/10/rosquinha-frita-768x619.jpg">
        <p>R$ 2,50</p>
        <button onclick="adicionar('Rosquinha',2.50,'p5',this)">Adicionar</button>
    </div>
    <div class="item" id="p6">
        <h3>Pão Integral</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTi597Ni7HL583CygxXRIYn618_gQDX4fhdGA&s">
        <p>R$ 8,90</p>
        <button onclick="adicionar('Pão Integral',8.90,'p6',this)">Adicionar</button>
    </div>
    <div class="item" id="p7">
        <h3>Sonho</h3>
        <img src="https://tudodelicious.com/wp-content/uploads/2025/09/Sonho-de-Padaria-1024x1024.jpg">
        <p>R$ 5,00</p>
        <button onclick="adicionar('Sonho',5.00,'p7',this)">Adicionar</button>
    </div>
</div>

<button id="btnCarrinho" onclick="irParaCarrinho()">🛒 Ir para o Carrinho</button>

<script>
    document.getElementById("clienteNome").innerText =
        "Olá, " + (localStorage.getItem("clienteNome") || "Cliente") + "!";

    function adicionar(nome, preco, id, botao){
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        carrinho.push({nome, preco, quantidade:1});
        localStorage.setItem("carrinho", JSON.stringify(carrinho));

        document.getElementById(id).classList.add("animar");

        botao.innerHTML = "✔ Adicionado!";
        botao.style.background = "#28d628";
        setTimeout(()=>{
            botao.innerHTML = "Adicionar";
            botao.style.background = "linear-gradient(45deg,#e60000,#cc0000)";
        },800);
    }

    function irParaCarrinho(){
        window.location.href = "carrinho.html";
    }
</script>

</body>
</html>
